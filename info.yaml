# Tiny Tapeout project information
project:
  title:        "Khatam-V"
  author:       "Sheheryar"
  discord:      ""
  description:  "RISC-V game console: RV32E CPU running C from QSPI flash, VGA graphics with islamic star patterns, sprites and sound"
  language:     "Verilog"
  clock_hz:     25000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "4x2"

  top_module:  "tt_um_khatam_v"

  source_files:
    - "project.v"
    - "cpu.v"
    - "adder.v"
    - "qspi.v"
    - "gpu.v"
    - "audio.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "button 0 (left in starfall)"
  ui[1]: "button 1 (right)"
  ui[2]: "button 2 (start)"
  ui[3]: "button 3"
  ui[4]: "button 4"
  ui[5]: "button 5"
  ui[6]: "button 6"
  ui[7]: "button 7"

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: "flash CS"
  uio[1]: "SPI MOSI"
  uio[2]: "SPI MISO"
  uio[3]: "SPI SCK"
  uio[4]: "IO2 (held high)"
  uio[5]: "IO3 (held high)"
  uio[6]: "PSRAM CS"
  uio[7]: "audio out (PWM)"

# Do not change!
yaml_version: 6
